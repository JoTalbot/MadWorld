name: Remote Operator Workflow Dispatch

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  actions: write
  contents: write

concurrency:
  group: remote-operator-workflow-dispatch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SSH_HOST: ${{ secrets.REMOTE_SSH_HOST }}
      SSH_PORT: ${{ secrets.REMOTE_SSH_PORT }}
      SSH_USER: ${{ secrets.REMOTE_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.REMOTE_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.REMOTE_SSH_HOST_KEY }}
      REMOTE_WORKDIR: ${{ secrets.REMOTE_WORKDIR }}
    steps:
      - name: Checkout main queue
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare result branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin remote-operator-results:refs/remotes/origin/remote-operator-results
          git config user.name 'madworld-remote-operator'
          git config user.email 'madworld-remote-operator@users.noreply.github.com'

      - name: Dispatch pending workflow requests and wait for terminal results
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, re, subprocess, sys, time
          from pathlib import Path

          repo = os.environ['REPOSITORY']
          token = os.environ['GH_TOKEN']
          root = Path('.github/remote-operator/REQUESTS')
          result_ref = 'refs/remotes/origin/remote-operator-results'
          work = Path('.workflow-dispatch-state/results')
          work.mkdir(parents=True, exist_ok=True)

          def gh_api(args):
              p = subprocess.run(['gh', 'api', *args], text=True, capture_output=True,
                                 env={**os.environ, 'GH_TOKEN': token})
              if p.returncode:
                  raise RuntimeError(p.stderr.strip() or f'gh api failed: {p.returncode}')
              return json.loads(p.stdout) if p.stdout.strip() else {}

          def state_exists(cid):
              return subprocess.run(
                  ['git', 'cat-file', '-e', f'{result_ref}:.github/remote-operator/workflow-dispatch/{cid}.json'],
                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode == 0

          def parse_inputs(raw):
              if not raw:
                  return {}
              try:
                  value = json.loads(raw)
              except json.JSONDecodeError:
                  repaired = re.sub(r'\\(?!["\\/bfnrtu])', r'\\\\', raw)
                  try:
                      value = json.loads(repaired)
                  except json.JSONDecodeError as exc:
                      raise ValueError(f'INPUTS_JSON invalid after safe escape repair: {exc}') from exc
              if not isinstance(value, dict):
                  raise ValueError('INPUTS_JSON must decode to an object')
              return value

          requests = []
          if root.exists():
              for path in sorted(root.glob('*.txt')):
                  text = path.read_text(encoding='utf-8')
                  for block in re.split(r'(?m)^---\s*$', text):
                      if not re.search(r'(?m)^TYPE:\s*WORKFLOW_DISPATCH\s*$', block):
                          continue
                      m = re.search(r'(?m)^COMMAND_ID:\s*(\S+)', block)
                      st = re.search(r'(?m)^STATUS:\s*(\S+)', block)
                      wf = re.search(r'(?m)^WORKFLOW:\s*(\S+)', block)
                      ref = re.search(r'(?m)^REF:\s*(\S+)', block)
                      tm = re.search(r'(?m)^TIMEOUT_MINUTES:\s*(\d+)', block)
                      inp = re.search(r'(?m)^INPUTS_JSON:\s*(\{.*\})\s*$', block)
                      if not (m and st and wf and ref) or st.group(1) != 'PENDING':
                          continue
                      cid = m.group(1)
                      if not re.fullmatch(r'cmd-[0-9]{8}-[0-9]{6}-[A-Za-z0-9._-]+', cid):
                          continue
                      if state_exists(cid):
                          continue
                      inputs = parse_inputs(inp.group(1) if inp else '')
                      requests.append((cid, wf.group(1), ref.group(1), inputs,
                                       int(tm.group(1)) if tm else 30, path.name))

          if not requests:
              print('No pending workflow-dispatch requests.')
              sys.exit(0)

          def run_remote(cid, inputs, timeout_minutes):
              command = str(inputs.get('command', ''))
              if not command:
                  raise ValueError('remote-operator-dispatch request has no command input')
              timeout = int(inputs.get('timeout_minutes', timeout_minutes))
              workdir = str(inputs.get('workdir') or os.environ.get('REMOTE_WORKDIR') or '/tmp')
              cleanup = str(inputs.get('cleanup', 'true')).lower() == 'true'
              required = ('SSH_HOST', 'SSH_USER', 'SSH_PRIVATE_KEY', 'SSH_HOST_KEY')
              if any(not os.environ.get(k) for k in required):
                  raise RuntimeError('Remote SSH secrets are incomplete')
              local = Path(os.environ.get('RUNNER_TEMP', '/tmp')) / f'remote-{cid}'
              local.mkdir(parents=True, exist_ok=True)
              key = local / 'key'
              known = local / 'known_hosts'
              key.write_text(os.environ['SSH_PRIVATE_KEY'] + '\n', encoding='utf-8')
              known.write_text(os.environ['SSH_HOST_KEY'] + '\n', encoding='utf-8')
              key.chmod(0o600); known.chmod(0o600)
              opts = ['-i', str(key), '-p', os.environ.get('SSH_PORT','22'), '-o', 'BatchMode=yes',
                      '-o', 'StrictHostKeyChecking=yes', '-o', f'UserKnownHostsFile={known}',
                      '-o', 'ConnectTimeout=20', '-o', 'ServerAliveInterval=30', '-o', 'ServerAliveCountMax=3']
              import shlex
              remote_cmd = f"cd {shlex.quote(workdir)} && if [ \"$(id -u)\" -eq 0 ]; then bash -lc {shlex.quote(command)}; else sudo -n bash -lc {shlex.quote(command)}; fi"
              started = time.time()
              p = subprocess.run(['ssh', *opts, f"{os.environ['SSH_USER']}@{os.environ['SSH_HOST']}", remote_cmd],
                                 text=True, capture_output=True, timeout=timeout*60)
              finished = time.time()
              result = {
                  'status': 'SUCCESS' if p.returncode == 0 else 'FAILED',
                  'operation': 'command', 'mode': 'sync', 'job_id': cid,
                  'server': os.environ['SSH_HOST'], 'workdir': workdir, 'run_as': 'root',
                  'started_at': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime(started)),
                  'finished_at': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime(finished)),
                  'duration_seconds': round(finished-started, 3), 'exit_code': p.returncode,
                  'stdout': p.stdout, 'stderr': p.stderr,
                  'executor': 'github-actions-remote-operator'
              }
              if cleanup:
                  for f in (key, known):
                      try: f.unlink()
                      except FileNotFoundError: pass
              return result

          for cid, workflow, ref, inputs, timeout_minutes, source in requests:
              started = time.time()
              record = {
                  'command_id': cid, 'type': 'WORKFLOW_DISPATCH', 'workflow': workflow,
                  'ref': ref, 'inputs': inputs, 'request_file': source,
                  'executor': 'github-actions-remote-operator',
                  'started_at': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime(started))
              }
              try:
                  if workflow == 'remote-operator-dispatch.yml':
                      result = run_remote(cid, inputs, timeout_minutes)
                      record.update({
                          'status': 'DONE' if result['status'] == 'SUCCESS' else 'FAILED',
                          'execution': 'direct-remote-operator',
                          'run_status': 'completed',
                          'run_conclusion': 'success' if result['status'] == 'SUCCESS' else 'failure',
                          'remote_result': result
                      })
                  else:
                      payload = json.dumps({'ref': ref, 'inputs': {str(k): str(v) for k, v in inputs.items()}})
                      p = subprocess.run([
                          'gh', 'api', '--method', 'POST',
                          '-H', 'Accept: application/vnd.github+json',
                          '-H', 'X-GitHub-Api-Version: 2026-03-10',
                          f'/repos/{repo}/actions/workflows/{workflow}/dispatches', '--input', '-'
                      ], input=payload, text=True, capture_output=True,
                      env={**os.environ, 'GH_TOKEN': token})
                      if p.returncode:
                          raise RuntimeError(p.stderr.strip() or 'workflow dispatch failed')
                      time.sleep(3)
                      runs = gh_api([f'/repos/{repo}/actions/workflows/{workflow}/runs?branch={ref}&event=workflow_dispatch&per_page=20'])
                      candidates = [r for r in runs.get('workflow_runs', []) if r.get('created_at', '') >= record['started_at']]
                      candidates.sort(key=lambda r: r.get('id', 0), reverse=True)
                      if not candidates:
                          raise RuntimeError('dispatch accepted but workflow run could not be located')
                      run = candidates[0]
                      run_id = run['id']
                      record['workflow_run_id'] = run_id
                      record['run_url'] = run.get('html_url')
                      deadline = time.time() + timeout_minutes * 60
                      while True:
                          run = gh_api([f'/repos/{repo}/actions/runs/{run_id}'])
                          record['run_status'] = run.get('status')
                          record['run_conclusion'] = run.get('conclusion')
                          if run.get('status') == 'completed': break
                          if time.time() >= deadline:
                              record['status'] = 'TIMEOUT'; record['error'] = f'workflow run timeout after {timeout_minutes} minutes'; break
                          time.sleep(10)
                      if run.get('status') == 'completed':
                          record['status'] = 'DONE' if run.get('conclusion') == 'success' else 'FAILED'
                          jobs = gh_api([f'/repos/{repo}/actions/runs/{run_id}/jobs?per_page=100'])
                          record['jobs'] = [{'id':j.get('id'),'name':j.get('name'),'status':j.get('status'),'conclusion':j.get('conclusion')} for j in jobs.get('jobs',[])]
                          arts = gh_api([f'/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100'])
                          record['artifacts'] = [{'id':a.get('id'),'name':a.get('name'),'size_in_bytes':a.get('size_in_bytes'),'expired':a.get('expired')} for a in arts.get('artifacts',[])]
              except subprocess.TimeoutExpired:
                  record['status'] = 'TIMEOUT'; record['error'] = f'remote command timeout after {timeout_minutes} minutes'
              except Exception as exc:
                  record['status'] = 'FAILED'; record['error'] = str(exc)
              record['finished_at'] = time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())
              record['duration_seconds'] = int(time.time() - started)
              (work / f'{cid}.json').write_text(json.dumps(record, indent=2, sort_keys=True) + '\n', encoding='utf-8')
              print(json.dumps(record, indent=2, sort_keys=True))

          # Publish with a fetch/rebase retry loop because multiple broker/reconciler runs can
          # legitimately update remote-operator-results concurrently. Never discard evidence.
          target = Path('.github/remote-operator/workflow-dispatch')
          for attempt in range(1, 6):
              subprocess.run(['git', 'fetch', 'origin', 'remote-operator-results:refs/remotes/origin/remote-operator-results'], check=True)
              subprocess.run(['git', 'checkout', '-B', 'workflow-dispatch-publish', result_ref], check=True)
              target.mkdir(parents=True, exist_ok=True)
              for p in work.glob('*.json'):
                  (target / p.name).write_text(p.read_text(encoding='utf-8'), encoding='utf-8')
              subprocess.run(['git', 'add', str(target)], check=True)
              if subprocess.run(['git', 'diff', '--cached', '--quiet']).returncode == 0:
                  print('No new workflow-dispatch evidence to publish.')
                  break
              subprocess.run(['git', 'commit', '-m', 'ops: publish workflow dispatch results'], check=True)
              push = subprocess.run(['git', 'push', 'origin', 'HEAD:remote-operator-results'], text=True, capture_output=True)
              if push.returncode == 0:
                  print(f'Published workflow-dispatch evidence on attempt {attempt}.')
                  break
              print(f'Publish attempt {attempt} failed; refreshing result branch before retry.', file=sys.stderr)
              if attempt == 5:
                  print(push.stderr, file=sys.stderr)
                  raise RuntimeError('failed to publish workflow-dispatch evidence after 5 attempts')
              time.sleep(2 * attempt)
          PY

      - name: Summary
        if: always()
        shell: bash
        run: echo 'Remote Operator workflow-dispatch broker completed.' >> "$GITHUB_STEP_SUMMARY"
