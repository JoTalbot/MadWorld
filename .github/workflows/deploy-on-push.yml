name: Deploy on Push

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/remote-operator/state/**'
      - '.github/remote-operator/results/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: madworld-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Sync repository to project server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SSH_HOST: ${{ secrets.REMOTE_SSH_HOST }}
      SSH_PORT: ${{ secrets.REMOTE_SSH_PORT }}
      SSH_USER: ${{ secrets.REMOTE_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.REMOTE_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.REMOTE_SSH_HOST_KEY }}
      REMOTE_WORKDIR: ${{ secrets.REMOTE_WORKDIR }}

    steps:
      - name: Checkout exact target commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${SSH_HOST:-}" ]] || { echo 'REMOTE_SSH_HOST is not configured' >&2; exit 2; }
          [[ -n "${SSH_USER:-}" ]] || { echo 'REMOTE_SSH_USER is not configured' >&2; exit 2; }
          [[ -n "${SSH_PRIVATE_KEY:-}" ]] || { echo 'REMOTE_SSH_PRIVATE_KEY is not configured' >&2; exit 2; }
          [[ -n "${SSH_HOST_KEY:-}" ]] || { echo 'REMOTE_SSH_HOST_KEY is not configured' >&2; exit 2; }
          [[ -n "${REMOTE_WORKDIR:-}" ]] || { echo 'REMOTE_WORKDIR is not configured' >&2; exit 2; }
          [[ "${REMOTE_WORKDIR}" == /* ]] || { echo 'REMOTE_WORKDIR must be an absolute path' >&2; exit 2; }
          echo "Deploying commit: ${GITHUB_SHA}"

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$SSH_HOST_KEY" > "$RUNNER_TEMP/deploy_known_hosts"
          chmod 600 "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/deploy_known_hosts"
          test -s "$RUNNER_TEMP/deploy_key"
          test -s "$RUNNER_TEMP/deploy_known_hosts"

      - name: Sync repository files to server
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS=(
            -i "$RUNNER_TEMP/deploy_key"
            -p "${SSH_PORT:-22}"
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$RUNNER_TEMP/deploy_known_hosts"
            -o ConnectTimeout=20
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=3
          )
          TARGET="${SSH_USER}@${SSH_HOST}"

          ssh "${SSH_OPTS[@]}" "$TARGET" "mkdir -p -- $(printf '%q' "$REMOTE_WORKDIR")"

          rsync -a --checksum \
            --exclude='.git/' \
            -e "ssh ${SSH_OPTS[*]}" \
            "$GITHUB_WORKSPACE/" \
            "${TARGET}:${REMOTE_WORKDIR}/"

          ssh "${SSH_OPTS[@]}" "$TARGET" "printf '%s\\n' '${GITHUB_SHA}' > $(printf '%q' "$REMOTE_WORKDIR")/.github-deployed-sha && chmod 644 $(printf '%q' "$REMOTE_WORKDIR")/.github-deployed-sha"

      - name: Verify deployed revision and files
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS=(
            -i "$RUNNER_TEMP/deploy_key"
            -p "${SSH_PORT:-22}"
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$RUNNER_TEMP/deploy_known_hosts"
            -o ConnectTimeout=20
          )
          TARGET="${SSH_USER}@${SSH_HOST}"
          EXPECTED_SHA="${GITHUB_SHA}"

          ssh "${SSH_OPTS[@]}" "$TARGET" "cd $(printf '%q' "$REMOTE_WORKDIR") && actual=\$(cat .github-deployed-sha 2>/dev/null || true) && test \"\$actual\" = \"$EXPECTED_SHA\" && printf '%s\\n' '=== DEPLOY VERIFIED ===' && printf 'server=%s\\n' \"\$(hostname)\" && printf 'commit=%s\\n' \"\$actual\" && test -f AGENTS.md && test -f .github/remote-operator/COMMANDS.txt && test -d .github && printf '%s\\n' 'repository-files-present=yes' && printf '%s\\n' 'remote-operator-queue-present=yes' && printf 'workdir=%s\\n' \"\$(pwd)\""

      - name: Verify root runtime and deployed SHA
        shell: bash
        run: |
          set -uo pipefail
          start=$(date +%s)
          tmp="$RUNNER_TEMP/root-runtime"
          mkdir -p "$tmp"
          trap 'rm -f "$tmp/stdout.log" "$tmp/stderr.log"' EXIT
          SSH_OPTS=(
            -i "$RUNNER_TEMP/deploy_key"
            -p "${SSH_PORT:-22}"
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$RUNNER_TEMP/deploy_known_hosts"
            -o ConnectTimeout=20
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=3
          )
          TARGET="${SSH_USER}@${SSH_HOST}"
          qworkdir=$(printf '%q' "$REMOTE_WORKDIR")
          qexpected=$(printf '%q' "$GITHUB_SHA")
          timeout --signal=TERM --kill-after=20s 5m ssh "${SSH_OPTS[@]}" "$TARGET" "cd $qworkdir && if [[ \$(id -u) -eq 0 ]]; then bash -lc 'set -euo pipefail; test \"\$(id -u)\" -eq 0; printf \"ROOT_RUNTIME_VERIFY_START\\n\"; printf \"HOST=%s\\n\" \"\$(hostname)\"; printf \"EUID=%s\\n\" \"\$(id -u)\"; printf \"USER=%s\\n\" \"\$(id -un)\"; printf \"ROOT=yes\\n\"; actual=\$(cat .github-deployed-sha); test \"\$actual\" = $qexpected; printf \"DEPLOYED_SHA=%s\\n\" \"\$actual\"; printf \"ROOT_RUNTIME_VERIFY_END\\n\"'; else sudo -n bash -lc 'set -euo pipefail; test \"\$(id -u)\" -eq 0; printf \"ROOT_RUNTIME_VERIFY_START\\n\"; printf \"HOST=%s\\n\" \"\$(hostname)\"; printf \"EUID=%s\\n\" \"\$(id -u)\"; printf \"USER=%s\\n\" \"\$(id -un)\"; printf \"ROOT=yes\\n\"; actual=\$(cat .github-deployed-sha); test \"\$actual\" = $qexpected; printf \"DEPLOYED_SHA=%s\\n\" \"\$actual\"; printf \"ROOT_RUNTIME_VERIFY_END\\n\"'; fi" >"$tmp/stdout.log" 2>"$tmp/stderr.log"
          rc=$?
          status=SUCCESS
          [[ $rc -eq 0 ]] || status=FAILED
          [[ $rc -eq 124 || $rc -eq 137 ]] && status=TIMEOUT
          run_as=unknown
          if grep -q '^ROOT=yes$' "$tmp/stdout.log" && grep -q '^EUID=0$' "$tmp/stdout.log"; then run_as=root; fi
          cat "$tmp/stdout.log"
          cat "$tmp/stderr.log" >&2
          finished=$(date +%s)
          duration=$((finished-start))
          python3 - "$tmp/result.json" "$status" "$rc" "$start" "$finished" "$duration" "$SSH_HOST" "$REMOTE_WORKDIR" "$GITHUB_SHA" "$run_as" <<'PY'
import json,sys
path,status,rc,start,finished,duration,server,workdir,expected,run_as=sys.argv[1:]
d={'status':status,'operation':'root-runtime-verification','mode':'sync','server':server,'workdir':workdir,'expected_deployed_sha':expected,'run_as':run_as,'started_epoch':int(start),'finished_epoch':int(finished),'duration_seconds':int(duration),'exit_code':int(rc)}
json.dump(d,open(path,'w',encoding='utf-8'),indent=2)
print(json.dumps(d,indent=2))
PY
          cp "$tmp/result.json" root-runtime-result.json
          {
            echo '## Root Runtime Verification'
            echo
            cat root-runtime-result.json
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$status" == SUCCESS ]] && [[ "$run_as" == root ]]

      - name: Upload deployment verification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-verification
          path: |
            root-runtime-result.json
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup SSH credentials
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/deploy_known_hosts"

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo '## 🚀 MadWorld deployment'
            echo
            echo "- **Commit:** \`${GITHUB_SHA}\`"
            echo "- **Branch:** \`${GITHUB_REF_NAME}\`"
            echo "- **Target:** \`${REMOTE_WORKDIR}\`"
            echo '- **Mode:** repository → server file sync'
            echo '- **Deletes:** disabled; server-only files are preserved'
            echo '- **Deployment marker:** exact GitHub SHA written and verified'
            echo '- **Root runtime:** exact EUID=0 and deployed SHA verified in the same deployment job'
            echo '- **Remote-operator queue:** explicitly verified'
            echo '- **Remote-operator state/result pushes:** ignored'
          } >> "$GITHUB_STEP_SUMMARY"
