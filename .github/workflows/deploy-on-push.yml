name: Deploy on Push

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/remote-operator/state/**'
      - '.github/remote-operator/results/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: madworld-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Sync repository to project server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SSH_HOST: ${{ secrets.REMOTE_SSH_HOST }}
      SSH_PORT: ${{ secrets.REMOTE_SSH_PORT }}
      SSH_USER: ${{ secrets.REMOTE_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.REMOTE_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.REMOTE_SSH_HOST_KEY }}
      REMOTE_WORKDIR: ${{ secrets.REMOTE_WORKDIR }}

    steps:
      - name: Checkout exact target commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${SSH_HOST:-}" ]] || { echo 'REMOTE_SSH_HOST is not configured' >&2; exit 2; }
          [[ -n "${SSH_USER:-}" ]] || { echo 'REMOTE_SSH_USER is not configured' >&2; exit 2; }
          [[ -n "${SSH_PRIVATE_KEY:-}" ]] || { echo 'REMOTE_SSH_PRIVATE_KEY is not configured' >&2; exit 2; }
          [[ -n "${SSH_HOST_KEY:-}" ]] || { echo 'REMOTE_SSH_HOST_KEY is not configured' >&2; exit 2; }
          [[ -n "${REMOTE_WORKDIR:-}" ]] || { echo 'REMOTE_WORKDIR is not configured' >&2; exit 2; }
          [[ "${REMOTE_WORKDIR}" == /* ]] || { echo 'REMOTE_WORKDIR must be an absolute path' >&2; exit 2; }
          echo "Deploying commit: ${GITHUB_SHA}"

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$SSH_HOST_KEY" > "$RUNNER_TEMP/deploy_known_hosts"
          chmod 600 "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/deploy_known_hosts"
          test -s "$RUNNER_TEMP/deploy_key"
          test -s "$RUNNER_TEMP/deploy_known_hosts"

      - name: Sync repository files to server
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS=(
            -i "$RUNNER_TEMP/deploy_key"
            -p "${SSH_PORT:-22}"
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$RUNNER_TEMP/deploy_known_hosts"
            -o ConnectTimeout=20
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=3
          )
          TARGET="${SSH_USER}@${SSH_HOST}"

          ssh "${SSH_OPTS[@]}" "$TARGET" "mkdir -p -- $(printf '%q' "$REMOTE_WORKDIR")"

          rsync -a --checksum \
            --exclude='.git/' \
            -e "ssh ${SSH_OPTS[*]}" \
            "$GITHUB_WORKSPACE/" \
            "${TARGET}:${REMOTE_WORKDIR}/"

          ssh "${SSH_OPTS[@]}" "$TARGET" "printf '%s\\n' '${GITHUB_SHA}' > $(printf '%q' "$REMOTE_WORKDIR")/.github-deployed-sha && chmod 644 $(printf '%q' "$REMOTE_WORKDIR")/.github-deployed-sha"

      - name: Restart and run Remote Operator
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS=(
            -i "$RUNNER_TEMP/deploy_key"
            -p "${SSH_PORT:-22}"
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$RUNNER_TEMP/deploy_known_hosts"
            -o ConnectTimeout=20
          )
          TARGET="${SSH_USER}@${SSH_HOST}"
          ssh "${SSH_OPTS[@]}" "$TARGET" "sudo -n systemctl restart madworld-remote-operator.service && sudo -n systemctl is-active madworld-remote-operator.service && touch $(printf '%q' "$REMOTE_WORKDIR")/.github/remote-operator/COMMANDS.txt && sudo -n /opt/madworld/ops/remote-operator/executor.sh"

      - name: Verify deployed revision, files and root runtime
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS=(
            -i "$RUNNER_TEMP/deploy_key"
            -p "${SSH_PORT:-22}"
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$RUNNER_TEMP/deploy_known_hosts"
            -o ConnectTimeout=20
          )
          TARGET="${SSH_USER}@${SSH_HOST}"
          EXPECTED_SHA="${GITHUB_SHA}"

          ssh "${SSH_OPTS[@]}" "$TARGET" "cd $(printf '%q' "$REMOTE_WORKDIR") && actual=\$(cat .github-deployed-sha 2>/dev/null || true) && test \"\$actual\" = \"$EXPECTED_SHA\" && printf '%s\\n' '=== DEPLOY VERIFIED ===' && printf 'server=%s\\n' \"\$(hostname)\" && printf 'commit=%s\\n' \"\$actual\" && test -f AGENTS.md && test -f .github/remote-operator/COMMANDS.txt && test -d .github && printf '%s\\n' 'repository-files-present=yes' && printf '%s\\n' 'remote-operator-queue-present=yes' && printf 'workdir=%s\\n' \"\$(pwd)\" && printf 'transport_euid=%s\\n' \"\$(id -u)\" && if [[ \$(id -u) -eq 0 ]]; then printf '%s\\n' 'root-runtime=yes'; else test \"\$(sudo -n id -u)\" = 0 && printf '%s\\n' 'root-runtime=yes'; fi"

      - name: Cleanup SSH credentials
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/deploy_known_hosts"

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo '## 🚀 MadWorld deployment'
            echo
            echo "- **Commit:** \`${GITHUB_SHA}\`"
            echo "- **Branch:** \`${GITHUB_REF_NAME}\`"
            echo "- **Target:** \`${REMOTE_WORKDIR}\`"
            echo '- **Mode:** repository → server file sync'
            echo '- **Deletes:** disabled; server-only files are preserved'
            echo '- **Deployment marker:** exact GitHub SHA written and verified'
            echo '- **Remote Operator:** restarted and executor invoked; results are handled by the normal result-sync path'
            echo '- **Root runtime:** EUID=0 verified directly or through non-interactive sudo'
            echo '- **Remote-operator queue:** explicitly verified'
            echo '- **Remote-operator result/state-only pushes:** ignored'
          } >> "$GITHUB_STEP_SUMMARY"