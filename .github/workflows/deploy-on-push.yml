name: Deploy on Push

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/remote-operator/state/**'
      - '.github/remote-operator/results/**'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: madworld-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Sync repository to project server
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SSH_HOST: ${{ secrets.REMOTE_SSH_HOST }}
      SSH_PORT: ${{ secrets.REMOTE_SSH_PORT }}
      SSH_USER: ${{ secrets.REMOTE_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.REMOTE_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.REMOTE_SSH_HOST_KEY }}
      REMOTE_WORKDIR: ${{ secrets.REMOTE_WORKDIR }}

    steps:
      - name: Checkout exact target commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${SSH_HOST:-}" ]] || { echo 'REMOTE_SSH_HOST is not configured' >&2; exit 2; }
          [[ -n "${SSH_USER:-}" ]] || { echo 'REMOTE_SSH_USER is not configured' >&2; exit 2; }
          [[ -n "${SSH_PRIVATE_KEY:-}" ]] || { echo 'REMOTE_SSH_PRIVATE_KEY is not configured' >&2; exit 2; }
          [[ -n "${SSH_HOST_KEY:-}" ]] || { echo 'REMOTE_SSH_HOST_KEY is not configured' >&2; exit 2; }
          [[ -n "${REMOTE_WORKDIR:-}" ]] || { echo 'REMOTE_WORKDIR is not configured' >&2; exit 2; }
          [[ "${REMOTE_WORKDIR}" == /* ]] || { echo 'REMOTE_WORKDIR must be an absolute path' >&2; exit 2; }
          echo "Deploying commit: ${GITHUB_SHA}"

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$SSH_HOST_KEY" > "$RUNNER_TEMP/deploy_known_hosts"
          chmod 600 "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/deploy_known_hosts"
          test -s "$RUNNER_TEMP/deploy_key"
          test -s "$RUNNER_TEMP/deploy_known_hosts"

      - name: Sync repository files to server
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS=(
            -i "$RUNNER_TEMP/deploy_key"
            -p "${SSH_PORT:-22}"
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$RUNNER_TEMP/deploy_known_hosts"
            -o ConnectTimeout=20
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=3
          )
          TARGET="${SSH_USER}@${SSH_HOST}"

          ssh "${SSH_OPTS[@]}" "$TARGET" "mkdir -p -- $(printf '%q' "$REMOTE_WORKDIR")"

          rsync -a --checksum \
            --exclude='.git/' \
            -e "ssh ${SSH_OPTS[*]}" \
            "$GITHUB_WORKSPACE/" \
            "${TARGET}:${REMOTE_WORKDIR}/"

      - name: Verify deployed revision and files
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS=(
            -i "$RUNNER_TEMP/deploy_key"
            -p "${SSH_PORT:-22}"
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$RUNNER_TEMP/deploy_known_hosts"
            -o ConnectTimeout=20
          )
          TARGET="${SSH_USER}@${SSH_HOST}"

          ssh "${SSH_OPTS[@]}" "$TARGET" "cd $(printf '%q' "$REMOTE_WORKDIR") && printf '%s\\n' '=== DEPLOY VERIFIED ===' && printf 'server=%s\\n' \"\$(hostname)\" && printf 'commit=%s\\n' \"${GITHUB_SHA}\" && test -f AGENTS.md && test -f .github/remote-operator/COMMANDS.txt && test -d .github && printf '%s\\n' 'repository-files-present=yes' && printf '%s\\n' 'remote-operator-queue-present=yes' && printf 'workdir=%s\\n' \"\$(pwd)\""

      - name: Dispatch and verify Remote Operator root execution
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dispatch_epoch=$(date +%s)
          gh workflow run remote-operator.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f operation=command \
            -f mode=sync \
            -f timeout_minutes=5 \
            -f cleanup=true \
            -f command=$'set -euo pipefail\nprintf "ROOT_RUNTIME_VERIFY_START\\n"\nprintf "HOST=%s\\n" "$(hostname)"\nprintf "EUID=%s\\n" "$(id -u)"\nprintf "USER=%s\\n" "$(id -un)"\nprintf "ROOT=%s\\n" "$(if [[ $(id -u) -eq 0 ]]; then echo yes; else echo no; fi)"\nprintf "REMOTE_HEAD=%s\\n" "$(git -C /opt/madworld rev-parse HEAD 2>/dev/null || echo unknown)"\nprintf "ROOT_RUNTIME_VERIFY_END\\n"'

          deadline=$(( $(date +%s) + 900 ))
          run_id=''
          while (( $(date +%s) < deadline )); do
            run_id=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow remote-operator.yml \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,createdAt,status,conclusion,headSha \
              --jq '.[] | select(.headSha == "'"$GITHUB_SHA"'") | select((.createdAt | fromdateiso8601) >= '"$dispatch_epoch"') | .databaseId' \
              | head -n1 || true)

            if [[ -n "$run_id" ]]; then
              echo "REMOTE_OPERATOR_RUN_ID=$run_id"
              status=$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json status --jq '.status')
              echo "REMOTE_OPERATOR_STATUS=$status"
              if [[ "$status" == completed ]]; then
                conclusion=$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')
                echo "REMOTE_OPERATOR_CONCLUSION=$conclusion"
                gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name remote-operator-result --dir "$RUNNER_TEMP/remote-result"
                test -s "$RUNNER_TEMP/remote-result/result.json"
                cat "$RUNNER_TEMP/remote-result/result.json"
                python3 - "$RUNNER_TEMP/remote-result/result.json" <<'PY'
import json, sys
with open(sys.argv[1], encoding='utf-8') as f:
    data = json.load(f)
assert data.get('status') == 'SUCCESS', data
assert data.get('run_as') == 'root', data
assert data.get('exit_code') == 0, data
print('ROOT_RUNTIME_VERIFICATION=PASS')
PY
                [[ "$conclusion" == success ]]
                exit 0
              fi
            fi
            sleep 10
          done
          echo 'Timed out waiting for Remote Operator root verification.' >&2
          exit 1

      - name: Cleanup SSH credentials
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/deploy_known_hosts"

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo '## 🚀 MadWorld deployment'
            echo
            echo "- **Commit:** \`${GITHUB_SHA}\`"
            echo "- **Branch:** \`${GITHUB_REF_NAME}\`"
            echo "- **Target:** \`${REMOTE_WORKDIR}\`"
            echo '- **Mode:** repository → server file sync'
            echo '- **Deletes:** disabled; server-only files are preserved'
            echo '- **Remote-operator queue:** explicitly verified'
            echo '- **Remote-operator root runtime:** explicitly verified and polled'
            echo '- **Remote-operator result/state-only pushes:** ignored'
          } >> "$GITHUB_STEP_SUMMARY"
