name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: madworld
          POSTGRES_USER: madworld
          POSTGRES_DB: madworld_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U madworld -d madworld_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      MADWORLD_DATABASE_URL: postgresql+psycopg://madworld:madworld@localhost:5432/madworld_test
      PGPASSWORD: madworld
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: madworld
      PGDATABASE: madworld_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Apply database migrations
        run: for migration in migrations/*.sql; do psql -v ON_ERROR_STOP=1 -f "$migration"; done
      - name: Run tests
        run: python -m pytest -q