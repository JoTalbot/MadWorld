name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: madworld
          POSTGRES_USER: madworld
          POSTGRES_DB: madworld_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U madworld -d madworld_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      MADWORLD_DATABASE_URL: postgresql+psycopg://madworld:madworld@localhost:5432/madworld_test
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Apply database migrations
        run: python scripts/migrate.py
      - name: Verify application module resolution
        run: python -c "import app.main; print(app.main.__file__); print('routes=', len(app.main.app.routes)); assert any(r.path == '/api/v1/travel/plan' for r in app.main.app.routes)"
      - name: Run tests
        run: python -m pytest -q
