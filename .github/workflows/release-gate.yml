name: Release Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'android/**'
      - 'ops/**'
      - 'docs/**'
      - '.github/workflows/**'

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: madworld
          POSTGRES_PASSWORD: madworld
          POSTGRES_DB: madworld
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U madworld -d madworld"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MADWORLD_DATABASE_URL: postgresql://madworld:madworld@localhost:5432/madworld
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt pytest
      - name: Apply migrations
        run: python backend/scripts/migrate.py
      - name: Validate production Compose
        run: docker compose -f ops/docker-compose.production.yml config
      - name: Run backend release gate tests
        run: python -m pytest backend/tests -q

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Run Android unit tests
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Assemble production release APK
        run: gradle :app:assembleRelease -PMADWORLD_API_URL=https://api.autosklo.org.ua --no-daemon
      - name: Normalize release APK path
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs -type f -name '*.apk' -path '*/release/*' | sort | head -n 1)"
          test -n "$APK"
          case "$APK" in
            */release/*) ;;
            *) echo "not a release APK: $APK" >&2; exit 1 ;;
          esac
          mkdir -p app/build/outputs/apk/release
          cp "$APK" app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/apk/release/app-release.apk
      - name: Generate release checksum
        run: sha256sum app/build/outputs/apk/release/app-release.apk > app/build/outputs/apk/release/app-release.apk.sha256
      - name: Upload release-gate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: madworld-android-release-gate
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/app-release.apk.sha256

  gate:
    runs-on: ubuntu-latest
    needs: [backend, android]
    steps:
      - name: Release gate passed
        run: echo "Repository-side release gate passed. External production-owner checks remain required before production release."
