name: Android CI

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Run Android unit tests
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Assemble release APK
        run: gradle :app:assembleRelease -PMADWORLD_API_URL=https://api.autosklo.org.ua --no-daemon
      - name: Normalize release APK path
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs -type f -name '*.apk' | sort | head -n 1)"
          test -n "$APK"
          mkdir -p app/build/outputs/apk/release
          cp "$APK" app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/apk/release/app-release.apk
      - name: Generate release checksum
        run: sha256sum app/build/outputs/apk/release/app-release.apk > app/build/outputs/apk/release/app-release.apk.sha256
      - name: Upload Android build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: madworld-android-ci
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/app-release.apk.sha256
