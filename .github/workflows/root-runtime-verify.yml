name: Root Runtime Verification

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/remote-operator/state/**'
      - '.github/remote-operator/results/**'

permissions:
  contents: read

jobs:
  verify:
    name: Verify server root runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SSH_HOST: ${{ secrets.REMOTE_SSH_HOST }}
      SSH_PORT: ${{ secrets.REMOTE_SSH_PORT }}
      SSH_USER: ${{ secrets.REMOTE_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.REMOTE_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.REMOTE_SSH_HOST_KEY }}
      REMOTE_WORKDIR: ${{ secrets.REMOTE_WORKDIR }}

    steps:
      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${SSH_HOST:-}" ]] || { echo 'REMOTE_SSH_HOST is not configured' >&2; exit 2; }
          [[ -n "${SSH_USER:-}" ]] || { echo 'REMOTE_SSH_USER is not configured' >&2; exit 2; }
          [[ -n "${SSH_PRIVATE_KEY:-}" ]] || { echo 'REMOTE_SSH_PRIVATE_KEY is not configured' >&2; exit 2; }
          [[ -n "${SSH_HOST_KEY:-}" ]] || { echo 'REMOTE_SSH_HOST_KEY is not configured' >&2; exit 2; }
          [[ -n "${REMOTE_WORKDIR:-}" ]] || { echo 'REMOTE_WORKDIR is not configured' >&2; exit 2; }

      - name: Execute root verification
        shell: bash
        run: |
          set -uo pipefail
          start=$(date +%s)
          tmp="$RUNNER_TEMP/root-runtime"
          mkdir -p "$tmp"
          trap 'rm -f "$tmp/key" "$tmp/known_hosts"' EXIT
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$tmp/key"
          printf '%s\n' "$SSH_HOST_KEY" > "$tmp/known_hosts"
          chmod 600 "$tmp/key" "$tmp/known_hosts"
          opts=(-i "$tmp/key" -p "${SSH_PORT:-22}" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$tmp/known_hosts" -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=3)
          target="${SSH_USER}@${SSH_HOST}"
          qworkdir=$(printf '%q' "${REMOTE_WORKDIR}")
          set +e
          timeout --signal=TERM --kill-after=20s 5m ssh "${opts[@]}" "$target" "cd $qworkdir && if [[ \$(id -u) -eq 0 ]]; then bash -lc 'set -euo pipefail; printf \"ROOT_RUNTIME_VERIFY_START\\n\"; printf \"HOST=%s\\n\" \"\$(hostname)\"; printf \"EUID=%s\\n\" \"\$(id -u)\"; printf \"USER=%s\\n\" \"\$(id -un)\"; printf \"ROOT=%s\\n\" \"\$(if [[ \$(id -u) -eq 0 ]]; then echo yes; else echo no; fi)\"; printf \"REMOTE_HEAD=%s\\n\" \"\$(git -C /opt/madworld rev-parse HEAD 2>/dev/null || echo unknown)\"; printf \"ROOT_RUNTIME_VERIFY_END\\n\"'; else sudo -n bash -lc 'set -euo pipefail; printf \"ROOT_RUNTIME_VERIFY_START\\n\"; printf \"HOST=%s\\n\" \"\$(hostname)\"; printf \"EUID=%s\\n\" \"\$(id -u)\"; printf \"USER=%s\\n\" \"\$(id -un)\"; printf \"ROOT=%s\\n\" \"\$(if [[ \$(id -u) -eq 0 ]]; then echo yes; else echo no; fi)\"; printf \"REMOTE_HEAD=%s\\n\" \"\$(git -C /opt/madworld rev-parse HEAD 2>/dev/null || echo unknown)\"; printf \"ROOT_RUNTIME_VERIFY_END\\n\"'; fi" >"$tmp/stdout.log" 2>"$tmp/stderr.log"
          rc=$?
          set -e
          status=SUCCESS
          [[ $rc -eq 0 ]] || status=FAILED
          [[ $rc -eq 124 || $rc -eq 137 ]] && status=TIMEOUT
          cat "$tmp/stdout.log"
          cat "$tmp/stderr.log" >&2
          python3 - "$tmp/result.json" "$status" "$rc" "$start" "$SSH_HOST" <<'PY'
import json,sys,time
path,status,rc,start,server=sys.argv[1:]
d={'status':status,'operation':'root-runtime-verification','mode':'sync','server':server,'run_as':'root','started_epoch':int(start),'finished_epoch':int(time.time()),'duration_seconds':int(time.time())-int(start),'exit_code':int(rc)}
json.dump(d,open(path,'w',encoding='utf-8'),indent=2)
print(json.dumps(d,indent=2))
PY
          cp "$tmp/result.json" result.json
          cp "$tmp/stdout.log" stdout.log
          cp "$tmp/stderr.log" stderr.log
          {
            echo '## Root Runtime Verification'
            echo
            cat result.json
            echo
            echo '### stdout'
            echo '```text'
            cat stdout.log
            echo '```'
            echo '### stderr'
            echo '```text'
            cat stderr.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$status" == SUCCESS ]]

      - name: Upload verification result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: root-runtime-verification
          path: |
            result.json
            stdout.log
            stderr.log
          if-no-files-found: error
          retention-days: 14
