name: Reconcile stale Remote Operator queue

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit stale PENDING entries
        run: |
          chmod +x ops/remote-operator/reconcile-stale-pending.sh
          REMOTE_OPERATOR_PENDING_MAX_AGE_SECONDS=86400 ops/remote-operator/reconcile-stale-pending.sh | tee /tmp/reconcile.txt
      - name: Preserve audit output
        uses: actions/upload-artifact@v4
        with:
          name: stale-pending-reconciliation
          path: /tmp/reconcile.txt
