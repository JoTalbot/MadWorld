name: Universal Remote Operator

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operation
        required: true
        default: command
        type: choice
        options:
          - command
          - diagnostics
      command:
        description: Arbitrary shell command or multiline bash script
        required: false
        default: ''
        type: string
      mode:
        description: Execution mode
        required: true
        default: sync
        type: choice
        options:
          - sync
          - async
      timeout_minutes:
        description: Timeout in minutes
        required: true
        default: '30'
        type: string
      workdir:
        description: Remote working directory (blank = REMOTE_WORKDIR or $HOME)
        required: false
        default: ''
        type: string
      cleanup:
        description: Cleanup async temporary files after completion
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  remote:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SSH_HOST: ${{ secrets.REMOTE_SSH_HOST }}
      SSH_PORT: ${{ secrets.REMOTE_SSH_PORT }}
      SSH_USER: ${{ secrets.REMOTE_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.REMOTE_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.REMOTE_SSH_HOST_KEY }}
      REMOTE_WORKDIR: ${{ secrets.REMOTE_WORKDIR }}
      INPUT_COMMAND: ${{ inputs.command }}
      INPUT_WORKDIR: ${{ inputs.workdir }}
      INPUT_OPERATION: ${{ inputs.operation }}
      INPUT_MODE: ${{ inputs.mode }}
      INPUT_TIMEOUT: ${{ inputs.timeout_minutes }}
      INPUT_CLEANUP: ${{ inputs.cleanup }}
      GH_RUN_ID: ${{ github.run_id }}
      GH_RUN_ATTEMPT: ${{ github.run_attempt }}
      GH_REPOSITORY: ${{ github.repository }}
      GH_SHA: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${SSH_HOST:-}" ]] || { echo 'REMOTE_SSH_HOST is not configured' >&2; exit 2; }
          [[ -n "${SSH_USER:-}" ]] || { echo 'REMOTE_SSH_USER is not configured' >&2; exit 2; }
          [[ -n "${SSH_PRIVATE_KEY:-}" ]] || { echo 'REMOTE_SSH_PRIVATE_KEY is not configured' >&2; exit 2; }
          [[ -n "${SSH_HOST_KEY:-}" ]] || { echo 'REMOTE_SSH_HOST_KEY is not configured' >&2; exit 2; }
          [[ "${INPUT_OPERATION}" != command || -n "${INPUT_COMMAND}" ]] || { echo 'command is required for operation=command' >&2; exit 2; }
          [[ "${INPUT_MODE}" == sync || "${INPUT_MODE}" == async ]] || { echo 'mode must be sync or async' >&2; exit 2; }
          [[ "${INPUT_TIMEOUT}" =~ ^[0-9]+$ && "${INPUT_TIMEOUT}" -gt 0 ]] || { echo 'timeout_minutes must be a positive integer' >&2; exit 2; }

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/remote_operator_key"
          known_hosts="$RUNNER_TEMP/remote_operator_known_hosts"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$SSH_HOST_KEY" > "$known_hosts"
          chmod 600 "$key_file" "$known_hosts"
          echo "KEY_FILE=$key_file" >> "$GITHUB_ENV"
          echo "KNOWN_HOSTS=$known_hosts" >> "$GITHUB_ENV"

      - name: Execute remote command as root
        id: execute
        shell: bash
        env:
          SSH_PORT_EFFECTIVE: ${{ env.SSH_PORT }}
        run: |
          set -euo pipefail
          start_epoch=$(date +%s)
          started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          ssh_port="${SSH_PORT_EFFECTIVE:-22}"
          workdir="${INPUT_WORKDIR:-${REMOTE_WORKDIR:-$HOME}}"
          job_id="gha-${GH_RUN_ID}-${GH_RUN_ATTEMPT}"
          local_tmp="$RUNNER_TEMP/remote-operator-$job_id"
          mkdir -p "$local_tmp"
          trap 'rm -f "$KEY_FILE" "$KNOWN_HOSTS"' EXIT

          ssh_opts=(
            -i "$KEY_FILE"
            -p "$ssh_port"
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$KNOWN_HOSTS"
            -o ConnectTimeout=20
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=3
          )
          target="${SSH_USER}@${SSH_HOST}"

          if [[ "$INPUT_OPERATION" == diagnostics ]]; then
            command_text='set -u
printf "=== REMOTE_OPERATOR_DIAGNOSTICS ===\\n"
printf "OS: "; ( . /etc/os-release 2>/dev/null && printf "%s %s\\n" "${NAME:-unknown}" "${VERSION_ID:-unknown}" ) || true
printf "HOSTNAME: "; hostname || true
printf "USER: "; id || true
printf "EUID: "; id -u || true
printf "PWD: "; pwd || true
printf "CPU: "; (nproc 2>/dev/null || true)
printf "RAM: "; (free -h 2>/dev/null || true)
printf "DISK: "; (df -h . 2>/dev/null || true)
printf "UPTIME: "; (uptime 2>/dev/null || true)
printf "GIT: "; (git rev-parse --show-toplevel 2>/dev/null || true)
printf "TOOLS:\\n"
for c in git docker systemctl python python3 node npm pnpm yarn java gradle go rustc cargo kubectl terraform make adb; do
  if command -v "$c" >/dev/null 2>&1; then printf "  %s: %s\\n" "$c" "$(command -v "$c")"; else printf "  %s: NOT_FOUND\\n" "$c"; fi
done'
          else
            command_text="$INPUT_COMMAND"
          fi

          # SSH_USER is only the transport identity. The payload itself MUST
          # execute with EUID 0. If SSH already lands as root, use bash; for a
          # non-root SSH account require passwordless sudo and fail closed.
          run_root_sync() {
            local qworkdir qcommand
            printf -v qworkdir '%q' "$workdir"
            printf -v qcommand '%q' "$command_text"
            ssh "${ssh_opts[@]}" "$target" "cd $qworkdir && if [[ \$(id -u) -eq 0 ]]; then bash -lc $qcommand; else sudo -n bash -lc $qcommand; fi"
          }

          if [[ "$INPUT_MODE" == sync ]]; then
            set +e
            run_root_sync >"$local_tmp/stdout.log" 2>"$local_tmp/stderr.log"
            rc=$?
            set -e
            finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            finish_epoch=$(date +%s)
            duration=$((finish_epoch-start_epoch))
            status=SUCCESS
            [[ $rc -eq 0 ]] || status=FAILED
            pid=null
            cat > "$local_tmp/result.json" <<EOF
          {
            "status":"$status",
            "operation":"$INPUT_OPERATION",
            "mode":"$INPUT_MODE",
            "job_id":"$job_id",
            "server":"$SSH_HOST",
            "workdir":$(printf '%s' "$workdir" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))'),
            "run_as":"root",
            "started_at":"$started_at",
            "finished_at":"$finished_at",
            "duration_seconds":$duration,
            "pid":$pid,
            "exit_code":$rc
          }
          EOF
          else
            payload_b64=$(printf '%s' "$command_text" | base64 -w0)
            remote_dir="${REMOTE_WORKDIR:-$HOME}/.gha-remote-operator/$job_id"
            ssh "${ssh_opts[@]}" "$target" "mkdir -p $(printf '%q' "$remote_dir") && printf '%s' $(printf '%q' "$payload_b64") | base64 -d > $(printf '%q' "$remote_dir/command.sh") && chmod 700 $(printf '%q' "$remote_dir/command.sh") && (cd $(printf '%q' "$workdir") && if [[ \$(id -u) -eq 0 ]]; then bash $(printf '%q' "$remote_dir/command.sh") >$(printf '%q' "$remote_dir/stdout.log") 2>$(printf '%q' "$remote_dir/stderr.log"); else sudo -n bash $(printf '%q' "$remote_dir/command.sh") >$(printf '%q' "$remote_dir/stdout.log") 2>$(printf '%q' "$remote_dir/stderr.log"); fi; printf '%s\\n' \$? >$(printf '%q' "$remote_dir/exit_code")) </dev/null >/dev/null 2>&1 & echo \$! >$(printf '%q' "$remote_dir/pid")"
            deadline=$(( $(date +%s) + INPUT_TIMEOUT*60 ))
            rc=125
            status=TIMEOUT
            while (( $(date +%s) < deadline )); do
              state=$(ssh "${ssh_opts[@]}" "$target" "if [[ -f $(printf '%q' "$remote_dir/exit_code") ]]; then printf 'DONE'; elif kill -0 \$(cat $(printf '%q' "$remote_dir/pid")) 2>/dev/null; then printf 'RUNNING'; else printf 'UNKNOWN'; fi") || state=UNKNOWN
              if [[ "$state" == DONE ]]; then
                rc=$(ssh "${ssh_opts[@]}" "$target" "cat $(printf '%q' "$remote_dir/exit_code")")
                status=SUCCESS
                [[ "$rc" -eq 0 ]] || status=FAILED
                break
              fi
              sleep 10
            done
            ssh "${ssh_opts[@]}" "$target" "cat $(printf '%q' "$remote_dir/stdout.log")" >"$local_tmp/stdout.log" 2>/dev/null || true
            ssh "${ssh_opts[@]}" "$target" "cat $(printf '%q' "$remote_dir/stderr.log")" >"$local_tmp/stderr.log" 2>/dev/null || true
            pid=$(ssh "${ssh_opts[@]}" "$target" "cat $(printf '%q' "$remote_dir/pid")" 2>/dev/null || true)
            finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            finish_epoch=$(date +%s)
            duration=$((finish_epoch-start_epoch))
            if [[ "$status" == TIMEOUT && -n "$pid" ]]; then
              echo "TIMEOUT: remote process may still be running, PID=$pid" >> "$local_tmp/stderr.log"
            fi
            cat > "$local_tmp/result.json" <<EOF
          {
            "status":"$status",
            "operation":"$INPUT_OPERATION",
            "mode":"$INPUT_MODE",
            "job_id":"$job_id",
            "server":"$SSH_HOST",
            "workdir":$(printf '%s' "$workdir" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))'),
            "run_as":"root",
            "started_at":"$started_at",
            "finished_at":"$finished_at",
            "duration_seconds":$duration,
            "pid":$(printf '%s' "${pid:-}" | python3 -c 'import json,sys; s=sys.stdin.read().strip(); print(s if s.isdigit() else "null")'),
            "exit_code":$rc
          }
          EOF
            if [[ "${INPUT_CLEANUP}" == true && "$status" != TIMEOUT ]]; then
              ssh "${ssh_opts[@]}" "$target" "rm -rf $(printf '%q' "$remote_dir")" || true
            fi
          fi

          status=$(python3 -c 'import json; print(json.load(open("'$local_tmp'/result.json"))["status"])')
          rc=$(python3 -c 'import json; print(json.load(open("'$local_tmp'/result.json"))["exit_code"])')
          {
            echo "## Remote Operator"
            echo "- **Status:** $status"
            echo "- **Operation:** $INPUT_OPERATION"
            echo "- **Mode:** $INPUT_MODE"
            echo "- **Server:** $SSH_HOST"
            echo "- **Workdir:** $workdir"
            echo "- **Run as:** root (EUID 0 required)"
            echo "- **Exit code:** $rc"
            echo "- **Job ID:** $job_id"
            echo
            echo '### stdout (tail)'
            echo '```text'
            tail -n 80 "$local_tmp/stdout.log" || true
            echo '```'
            echo
            echo '### stderr (tail)'
            echo '```text'
            tail -n 80 "$local_tmp/stderr.log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          cp "$local_tmp/result.json" "$GITHUB_WORKSPACE/result.json"
          {
            echo "# Remote Operator Result"
            echo
            cat "$local_tmp/result.json"
          } > "$GITHUB_WORKSPACE/result.md"
          cp "$local_tmp/stdout.log" "$GITHUB_WORKSPACE/stdout.log"
          cp "$local_tmp/stderr.log" "$GITHUB_WORKSPACE/stderr.log"

          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          [[ "$status" == SUCCESS ]]

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-operator-result
          path: |
            result.json
            result.md
            stdout.log
            stderr.log
          if-no-files-found: error
          retention-days: 14
