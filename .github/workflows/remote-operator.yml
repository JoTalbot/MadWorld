name: Universal Remote Operator

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operation
        required: true
        default: command
        type: choice
        options: [command, diagnostics]
      command:
        description: Arbitrary shell command or multiline Bash script
        required: false
        default: ''
        type: string
      mode:
        description: Execution mode
        required: true
        default: sync
        type: choice
        options: [sync, async]
      timeout_minutes:
        description: Timeout in minutes
        required: true
        default: '30'
        type: string
      workdir:
        description: Remote working directory
        required: false
        default: ''
        type: string
      cleanup:
        description: Cleanup completed async job directory
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  remote:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SSH_HOST: ${{ secrets.REMOTE_SSH_HOST }}
      SSH_PORT: ${{ secrets.REMOTE_SSH_PORT }}
      SSH_USER: ${{ secrets.REMOTE_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.REMOTE_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.REMOTE_SSH_HOST_KEY }}
      REMOTE_WORKDIR: ${{ secrets.REMOTE_WORKDIR }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate inputs
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          COMMAND: ${{ inputs.command }}
          MODE: ${{ inputs.mode }}
          TIMEOUT: ${{ inputs.timeout_minutes }}
        run: |
          set -euo pipefail
          [[ -n "${SSH_HOST:-}" && -n "${SSH_USER:-}" && -n "${SSH_PRIVATE_KEY:-}" && -n "${SSH_HOST_KEY:-}" ]] || { echo 'Remote SSH secrets are incomplete' >&2; exit 2; }
          [[ "$OPERATION" == command || "$OPERATION" == diagnostics ]] || exit 2
          [[ "$MODE" == sync || "$MODE" == async ]] || exit 2
          [[ "$OPERATION" != command || -n "$COMMAND" ]] || { echo 'command is required' >&2; exit 2; }
          [[ "$TIMEOUT" =~ ^[0-9]+$ && "$TIMEOUT" -gt 0 ]] || { echo 'timeout_minutes must be positive' >&2; exit 2; }

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/remote_key"
          printf '%s\n' "$SSH_HOST_KEY" > "$RUNNER_TEMP/remote_known_hosts"
          chmod 600 "$RUNNER_TEMP/remote_key" "$RUNNER_TEMP/remote_known_hosts"

      - name: Execute and collect result
        id: execute
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          COMMAND: ${{ inputs.command }}
          MODE: ${{ inputs.mode }}
          TIMEOUT: ${{ inputs.timeout_minutes }}
          INPUT_WORKDIR: ${{ inputs.workdir }}
          CLEANUP: ${{ inputs.cleanup }}
        run: |
          set -euo pipefail
          start_epoch=$(date +%s)
          started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          workdir="${INPUT_WORKDIR:-${REMOTE_WORKDIR:-$HOME}}"
          job_id="gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          local_tmp="$RUNNER_TEMP/remote-$job_id"
          mkdir -p "$local_tmp"
          ssh_opts=(-i "$RUNNER_TEMP/remote_key" -p "${SSH_PORT:-22}" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/remote_known_hosts" -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=3)
          target="${SSH_USER}@${SSH_HOST}"

          if [[ "$OPERATION" == diagnostics ]]; then
            command_text=$'set -u\nprintf "OS: "; (. /etc/os-release 2>/dev/null && printf "%s %s\\n" "${NAME:-unknown}" "${VERSION_ID:-unknown}") || true\nprintf "HOSTNAME: "; hostname || true\nprintf "USER: "; id || true\nprintf "EUID: "; id -u || true\nprintf "PWD: "; pwd || true\nprintf "CPU: "; nproc 2>/dev/null || true\nprintf "RAM: "; free -h 2>/dev/null || true\nprintf "DISK: "; df -h . 2>/dev/null || true\nprintf "UPTIME: "; uptime 2>/dev/null || true\nprintf "GIT: "; git rev-parse --show-toplevel 2>/dev/null || true'
          else
            command_text="$COMMAND"
          fi

          printf -v qworkdir '%q' "$workdir"
          printf -v qcommand '%q' "$command_text"
          run_root() {
            ssh "${ssh_opts[@]}" "$target" "cd $qworkdir && if [[ \$(id -u) -eq 0 ]]; then bash -lc $qcommand; else sudo -n bash -lc $qcommand; fi"
          }

          if [[ "$MODE" == sync ]]; then
            set +e
            run_root >"$local_tmp/stdout.log" 2>"$local_tmp/stderr.log"
            rc=$?
            set -e
            status=SUCCESS
            [[ $rc -eq 0 ]] || status=FAILED
            pid=null
          else
            remote_dir="${REMOTE_WORKDIR:-$HOME}/.gha-remote-operator/$job_id"
            payload=$(printf '%s' "$command_text" | base64 -w0)
            printf -v qrdir '%q' "$remote_dir"
            printf -v qpayload '%q' "$payload"
            ssh "${ssh_opts[@]}" "$target" "mkdir -p $qrdir; printf '%s' $qpayload | base64 -d > $qrdir/command.sh; chmod 700 $qrdir/command.sh; (cd $qworkdir && if [[ \$(id -u) -eq 0 ]]; then bash $qrdir/command.sh >$qrdir/stdout.log 2>$qrdir/stderr.log; else sudo -n bash $qrdir/command.sh >$qrdir/stdout.log 2>$qrdir/stderr.log; fi; printf '%s\\n' \$? >$qrdir/exit_code) </dev/null >/dev/null 2>&1 & echo \$! >$qrdir/pid"
            deadline=$(( $(date +%s) + TIMEOUT * 60 ))
            status=TIMEOUT
            rc=124
            pid=$(ssh "${ssh_opts[@]}" "$target" "cat $qrdir/pid")
            while (( $(date +%s) < deadline )); do
              if ssh "${ssh_opts[@]}" "$target" "test -f $qrdir/exit_code"; then
                rc=$(ssh "${ssh_opts[@]}" "$target" "cat $qrdir/exit_code")
                status=SUCCESS
                [[ "$rc" -eq 0 ]] || status=FAILED
                break
              fi
              sleep 10
            done
            ssh "${ssh_opts[@]}" "$target" "cat $qrdir/stdout.log" >"$local_tmp/stdout.log" 2>/dev/null || true
            ssh "${ssh_opts[@]}" "$target" "cat $qrdir/stderr.log" >"$local_tmp/stderr.log" 2>/dev/null || true
            if [[ "$status" == TIMEOUT ]]; then
              printf 'TIMEOUT: remote process may still be running, PID=%s\n' "$pid" >>"$local_tmp/stderr.log"
            elif [[ "$CLEANUP" == true ]]; then
              ssh "${ssh_opts[@]}" "$target" "rm -rf $qrdir" || true
            fi
          fi

          finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          duration=$(( $(date +%s) - start_epoch ))
          python3 - "$local_tmp/result.json" "$status" "$rc" "$started_at" "$finished_at" "$duration" "$SSH_HOST" "$workdir" "$MODE" "$OPERATION" "$job_id" "$pid" <<'PY'
import json, sys
path,status,rc,started,finished,duration,server,workdir,mode,operation,job_id,pid=sys.argv[1:]
d={'status':status,'operation':operation,'mode':mode,'job_id':job_id,'server':server,'workdir':workdir,'run_as':'root','started_at':started,'finished_at':finished,'duration_seconds':int(duration),'pid':None if pid=='null' else int(pid),'exit_code':int(rc)}
json.dump(d,open(path,'w',encoding='utf-8'),indent=2)
PY
          cp "$local_tmp/result.json" result.json
          cp "$local_tmp/stdout.log" stdout.log
          cp "$local_tmp/stderr.log" stderr.log
          cat result.json >> "$GITHUB_STEP_SUMMARY"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          [[ "$status" == SUCCESS ]]

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-operator-result
          path: |
            result.json
            stdout.log
            stderr.log
          if-no-files-found: error
          retention-days: 14
