name: Backup and DR Verification

on:
  workflow_dispatch:
  push:
    paths:
      - 'ops/backup_daily.sh'
      - 'ops/backup_restore.sh'
      - 'ops/madworld-backup.service'
      - 'ops/madworld-backup.timer'
      - '.github/workflows/backup-dr-verification.yml'

jobs:
  backup-restore:
    runs-on: ubuntu-latest
    services:
      postgres-source:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: madworld
          POSTGRES_DB: madworld_source
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d madworld_source"
          --health-interval 5s --health-timeout 5s --health-retries 20
      postgres-restore:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: madworld
          POSTGRES_DB: madworld_restore
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d madworld_restore"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Seed source database
        env:
          PGPASSWORD: madworld
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -p 55432 -U postgres -d madworld_source -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE schema_migrations (version text PRIMARY KEY);
          INSERT INTO schema_migrations VALUES ('001'), ('002'), ('003');
          CREATE TABLE dr_probe (id integer PRIMARY KEY, value text NOT NULL);
          INSERT INTO dr_probe VALUES (1, 'madworld-dr-verification');
          SQL

      - name: Measure backup and restore RTO
        env:
          PGPASSWORD: madworld
          MADWORLD_DATABASE_URL: postgresql://postgres:madworld@127.0.0.1:55432/madworld_source
          RESTORE_DATABASE_URL: postgresql://postgres:madworld@127.0.0.1:55433/madworld_restore
          BACKUP_FILE: ${{ runner.temp }}/madworld-dr.dump
        run: |
          set -euo pipefail
          START_NS=$(date +%s%N)
          export START_NS
          ./ops/backup_restore.sh
          psql "$RESTORE_DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) = 3 AS migrations_ok FROM schema_migrations;"
          psql "$RESTORE_DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT value = 'madworld-dr-verification' AS invariant_ok FROM dr_probe WHERE id = 1;"
          END_NS=$(date +%s%N)
          export END_NS
          python3 - <<'PY'
          import os
          start=int(os.environ['START_NS'])
          end=int(os.environ['END_NS'])
          print(f"measured_backup_restore_rto_seconds={(end-start)/1_000_000_000:.3f}")
          PY
