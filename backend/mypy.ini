# Static typing baseline. Scope is intentionally limited to the pure domain and
# application ports where Protocol-based contracts benefit most from checking.
[mypy]
python_version = 3.12
files = app/domain, app/application/ports.py, app/application/clock.py, app/application/errors.py, app/infrastructure/readiness.py, app/infrastructure/abuse_controls.py, app/infrastructure/sessions.py, app/infrastructure/migrations.py
ignore_missing_imports = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
check_untyped_defs = True
disallow_incomplete_defs = True
