# Static typing baseline. Scope is intentionally limited to the pure domain and
# application ports where Protocol-based contracts benefit most from checking.
[mypy]
python_version = 3.12
files = app/domain, app/application, app/infrastructure/readiness.py, app/infrastructure/abuse_controls.py, app/infrastructure/sessions.py, app/infrastructure/migrations.py
ignore_missing_imports = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
check_untyped_defs = True
disallow_incomplete_defs = True

# Legacy application modules with partially annotated signatures. Real type
# errors are still reported (check_untyped_defs); only incomplete annotations
# are tolerated. Remove a module from this list once its signatures are complete.
[mypy-app.application.phase7_economy_tx,app.application.contract_service,app.application.travel_service,app.application.master_b1_b2,app.application.world_tick_pipeline,app.application.territory_warfare,app.application.phase7_economy,app.application.npc_faction_simulation,app.application.phase6_world,app.application.expeditions,app.application.world_tick_pipeline_v2,app.application.world_event_consumers,app.application.observability,app.application.gathering]
disallow_incomplete_defs = False
